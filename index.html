<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中文時間</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .wrap { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16 / 9; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
</style>
</head>
<body>
  <h1>中文時間</h1>
  <div class="wrap">
    <iframe
      src="https://www.youtube.com/embed/videoseries?list=PLeXGOj6gnNR3x_DoF0-pEsxamL1oP0oBd"
      title="Peppa Pig Mandarin playlist"
      allow="accelerometer; encrypted-media; picture-in-picture"
      allowfullscreen></iframe>
  </div>
</body>
</html>
